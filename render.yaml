# Interim public demo (INFRA-015, INFRA-016, ADR-017, ADR-018).
# Free web services, one static site, and one Free Postgres.
# Upgrade Postgres before the 30-day expiry. Do not put real secrets in this file.
# AWS Terraform and Amplify stay in place. See docs/workflows/deploy-render.md.
# PR previews (INFRA-019, ADR-019): manual service previews for marketing and web only.
# No previews on the API or database, and no root-level previews.

databases:
  - name: medconnect-postgres
    plan: free
    region: frankfurt
    databaseName: medconnect
    user: medconnect
    postgresMajorVersion: "18"

services:
  - type: web
    name: medconnect-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    # NODE_ENV=production is set on this service, so npm ci would skip devDependencies
    # and `nest` would be missing. The CLI is only needed to compile.
    buildCommand: npm ci --include=dev && npm run build:api
    # Free web services reject preDeployCommand. start-api.mjs creates the role,
    # migrates, and seeds before listen.
    startCommand: node scripts/infra/start-api.mjs
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - scripts/infra/**
        - package.json
        - package-lock.json
    domains:
      - api.medconnectpro.app
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: preview
      - key: NODE_ENV
        value: production
      - key: DOCUMENT_STORAGE_DRIVER
        value: local
      - key: PUBLIC_API_PREFIX
        value: /mcp-api
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER_UI_ENABLED
        value: "false"
      - key: SEED_ON_DEPLOY
        value: "false"
      - key: APP_ROLE_PASSWORD
        generateValue: true
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: medconnect-postgres
          property: connectionString
      - key: WEB_ORIGIN
        value: https://medconnectpro.app
      - key: WEB_ORIGINS
        fromService:
          type: web
          name: medconnect-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: medconnect-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    # INFRA-019: render-web.mjs builds live only on main; a PR preview builds on
    # frontend mocks and starts without API_BASE_URL (/mcp-api answers 503).
    buildCommand: npm ci && node scripts/infra/render-web.mjs build
    startCommand: node scripts/infra/render-web.mjs start
    healthCheckPath: /login
    previews:
      generation: manual
    buildFilter:
      paths:
        - apps/web/**
        - scripts/infra/render-web.mjs
        - package.json
        - package-lock.json
    domains:
      - medconnectpro.app
      - www.medconnectpro.app
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /mcp-api
      - key: NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: NEXT_PUBLIC_MARKETING_URL
        value: https://marketing.medconnectpro.app
      - key: API_BASE_URL
        fromService:
          type: web
          name: medconnect-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: medconnect-marketing
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    # FE-048: render-marketing.mjs marks a PR preview build for the preview banner.
    buildCommand: npm ci && node scripts/infra/render-marketing.mjs build
    staticPublishPath: apps/marketing/out
    previews:
      generation: manual
    buildFilter:
      paths:
        - apps/marketing/**
        - apps/web/src/styles/tokens.css
        - scripts/infra/render-marketing.mjs
        - package.json
        - package-lock.json
    domains:
      - marketing.medconnectpro.app
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://marketing.medconnectpro.app
      - key: NEXT_PUBLIC_APP_ORIGIN
        value: https://medconnectpro.app
