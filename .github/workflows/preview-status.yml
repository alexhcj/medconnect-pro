# One project PR comment after quality CI completes. With GitHub Actions variable
# AMPLIFY_APP_ID set it advertises the Amplify PR preview URL (INFRA-010, M9). With it unset
# it describes the Render setup (INFRA-020, ADR-019). Amplify Git App still builds native PR
# previews; this workflow does not publish Amplify, assume AWS roles, or push ECR.
name: Preview status

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: preview-status-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  advertise:
    name: advertise
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upsert preview review comment
        uses: actions/github-script@v7
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
        with:
          script: |
            const marker = '<!-- medconnect-preview-status -->';
            const run = context.payload.workflow_run;
            const ciPassed = run.conclusion === 'success';
            const appId = (process.env.AMPLIFY_APP_ID || '').trim();

            let prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              const head = run.head_branch;
              if (!head) {
                core.info('No pull request or head branch on the CI run; skipping.');
                return;
              }
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${head}`,
                state: 'open',
              });
              prNumber = pulls[0]?.number;
            }
            if (!prNumber) {
              core.info('Could not resolve a pull request for the CI run; skipping.');
              return;
            }

            const previewUrl = appId
              ? `https://pr-${prNumber}.${appId}.amplifyapp.com`
              : null;

            const lanesUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/docs/workflows/delivery-lanes.md`;

            const amplifyPassed = [
              marker,
              '## Preview environment',
              '',
              `Review URL (after quality CI): ${previewUrl}`,
              '',
              'This frontend preview talks to the **shared** preview API and preview/demo database. Concurrent PRs can overwrite that data. Synthetic demo data only — never real PHI.',
              '',
              'Browser `NEXT_PUBLIC_API_BASE_URL` / `API_BASE_URL` must be Terraform `preview_api_url`, not `production_api_url`.',
              '',
              'Amplify may still post its own check while CI runs. Treat **this** comment as the project-advertised review URL. Do not merge until the required `ci` check is green.',
            ];

            const renderPassed = [
              marker,
              '## Preview environment',
              '',
              'Quality CI passed (`ci`).',
              '',
              'Render builds a preview only on request: add the `render-preview` label (or put `[render preview]` in the title). Previews exist for marketing and web only; API, infra and docs changes are reviewed on the diff and CI.',
              '',
              'A web preview runs on **mock data**. It has no live API or database, so it shows layout and role-based UI, not API behaviour. Synthetic demo data only — never real PHI.',
              '',
              `Lanes and what each one gets: [delivery-lanes.md](${lanesUrl}).`,
            ];

            const failed = [
              marker,
              '## Preview environment',
              '',
              'Quality CI failed. This pull request is **not** review-ready. Do not treat a preview URL or a host check as a green review signal.',
              '',
              'Re-run or fix CI. Preview guidance is posted only after `ci` succeeds.',
            ];

            const body = (ciPassed ? (previewUrl ? amplifyPassed : renderPassed) : failed).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
