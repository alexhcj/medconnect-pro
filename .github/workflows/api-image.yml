# Push the API image to ECR on main. ECS update is .github/workflows/production-deploy.yml (INFRA-011).
# Requires GitHub Actions variable AWS_PRODUCTION_ROLE_ARN (terraform output github_production_role_arn)
# and optional AWS_REGION (default us-east-1). Quality CI never assumes this role.
name: API image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  push:
    name: push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REGISTRY/medconnect-api:$IMAGE_TAG" -t "$ECR_REGISTRY/medconnect-api:latest" .
          docker push "$ECR_REGISTRY/medconnect-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/medconnect-api:latest"
