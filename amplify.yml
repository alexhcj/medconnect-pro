# Amplify Hosting for apps/web (INFRA-009). npm workspaces: install/build from the
# repository root. SSR artifacts are apps/web/.next — do not static-export.
# Operator steps: docs/workflows/deploy.md. Do not put DATABASE_* or AWS keys here.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24
            - npm ci
        build:
          commands:
            - npm run build:production
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
